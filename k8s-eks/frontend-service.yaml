apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: vibetrack
  labels:
    app: frontend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5173
  type: ClusterIP
