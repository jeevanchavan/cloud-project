apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibetrack-ingress
  namespace: vibetrack
  annotations:
    # AWS Load Balancer Controller configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:287167054132:certificate/f8ae2d07-7bf0-4c33-949a-ae47275bfc6e
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # Route API traffic to Node.js backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000

          # Route web traffic to React frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
