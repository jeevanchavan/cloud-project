name: Test GitHub Actions AWS Authentication

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check GitHub OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
            );

            console.log("OIDC subject:", payload.sub);
            console.log("OIDC audience:", payload.aud);

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::287167054132:role/GitHubActionsEKSRole

      - name: Test AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Test EKS Access
        run: |
          aws eks describe-cluster \
            --name vibetrack-cluster \
            --region ap-south-1