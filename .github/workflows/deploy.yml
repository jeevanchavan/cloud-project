name: Test AWS Connection

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::287167054132:role/GitHubActionsEKSRole

      - name: Test AWS Identity
        run: aws sts get-caller-identity

      - name: Test EKS Access
        run: aws eks describe-cluster --name vibetrack-cluster