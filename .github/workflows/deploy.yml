name: Build and Deploy to AWS EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push & Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::287167054132:role/GitHubActionsEKSRole
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/vibetrack-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/vibetrack-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/vibetrack-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/vibetrack-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name vibetrack-cluster

      - name: Deploy to EKS
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TAG="${{ github.sha }}"

          echo "Applying Kubernetes manifests (ConfigMap, Services, Ingress, HPA)..."
          kubectl apply -f k8s-eks/configmap.yaml
          kubectl apply -f k8s-eks/backend-service.yaml
          kubectl apply -f k8s-eks/frontend-service.yaml
          kubectl apply -f k8s-eks/ingress.yaml
          kubectl apply -f k8s-eks/backend-hpa.yaml
          kubectl apply -f k8s-eks/frontend-hpa.yaml

          echo "Updating deployment images to Git SHA: ${TAG}..."
          sed -i "s|image: .*vibetrack-backend:.*|image: ${REGISTRY}/vibetrack-backend:${TAG}|g" k8s-eks/backend-deployment.yaml
          sed -i "s|image: .*vibetrack-frontend:.*|image: ${REGISTRY}/vibetrack-frontend:${TAG}|g" k8s-eks/frontend-deployment.yaml

          kubectl apply -f k8s-eks/backend-deployment.yaml
          kubectl apply -f k8s-eks/frontend-deployment.yaml

          kubectl set image deployment/backend-deployment backend=${REGISTRY}/vibetrack-backend:${TAG} -n vibetrack
          kubectl set image deployment/frontend-deployment frontend=${REGISTRY}/vibetrack-frontend:${TAG} -n vibetrack

      - name: Verify Rollout Status
        run: |
          echo "Waiting for Backend rollout..."
          kubectl rollout status deployment/backend-deployment -n vibetrack --timeout=180s

          echo "Waiting for Frontend rollout..."
          kubectl rollout status deployment/frontend-deployment -n vibetrack --timeout=180s

          echo "=== All Deployments Successfully Updated and Healthy ==="
          kubectl get pods -n vibetrack -o wide